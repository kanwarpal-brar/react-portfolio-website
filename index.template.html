<!doctype html>
<html lang="en" class="nojs">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="{{name}}" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="{{siteUrl}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{siteUrl}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:locale" content="{{locale}}" />
    <meta property="og:site_name" content="{{name}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{name}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="preload"
      as="image"
      href="assets/headshot.webp"
      fetchpriority="high"
    />
    <script type="application/ld+json">
      {{jsonld}}
    </script>
    <script>
      document.documentElement.classList.remove("nojs");
    </script>
  </head>
  <body>
    <div id="shell">
      <header id="topbar" class="frame" aria-label="status bar">
        <span class="dots" aria-hidden="true"
          ><span class="dot"></span><span class="dot"></span
          ><span class="dot"></span
        ></span>
        <span class="title">kanwarpal@portfolio:~</span>
        <span class="meta" id="meta-dims">–×–</span>
      </header>
      <main id="graph" class="frame" data-view="home" data-boot>
        <h1 class="visually-hidden">{{name}} · portfolio</h1>
        <svg
          id="graph-lines"
          aria-hidden="true"
          preserveAspectRatio="none"
        ></svg>
        <nav id="nodes" aria-label="portfolio navigation">
          <!-- inject:nodes -->
        </nav>
      </main>
      <footer id="hintbar" class="frame">
        click a node to explore · <kbd>Esc</kbd> returns home
      </footer>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>

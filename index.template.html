<!doctype html>
<html lang="en" class="nojs">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="{{name}}" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="{{siteUrl}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{siteUrl}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:locale" content="{{locale}}" />
    <meta property="og:site_name" content="{{name}}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{name}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />

    <!-- Favicon (SVG, tiny) -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Preload critical asset -->
    <link
      rel="preload"
      as="image"
      href="assets/headshot.webp"
      fetchpriority="high"
    />

    <!-- JSON-LD: Person -->
    <script type="application/ld+json">
      {{jsonld}}
    </script>

    <script>
      // Remove the nojs class synchronously so the fallback layout never flashes.
      document.documentElement.classList.remove("nojs");
    </script>
  </head>
  <body>
    <div id="shell">
      <!-- ====== top status bar ====== -->
      <header id="topbar" class="frame" aria-label="status bar">
        <span class="dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span
          ><span class="dot"></span>
        </span>
        <span class="title">kanwarpal@portfolio:~</span>
        <span class="meta" id="meta-dims">—×—</span>
      </header>

      <!-- ====== central graph pane ====== -->
      <main id="graph" class="frame" data-view="home">
        <h1 class="visually-hidden">{{name}} — portfolio</h1>

        <svg
          id="graph-lines"
          aria-hidden="true"
          preserveAspectRatio="none"
        ></svg>

        <!-- 5 persistent section buttons, fixed pentagon slots. Always present;
           CSS dims/highlights them via #graph[data-view]/[data-section]. -->
        <div id="ring"><!-- inject:ring --></div>

        <!-- Radial child menu; populated + shown only for sections with children. -->
        <div id="wheel" hidden></div>

        <!-- Centered, content-sized, scrolling card — the focused content. -->
        <div id="card" tabindex="-1" role="region" aria-label="home">
          <!-- inject:home -->
        </div>
      </main>

      <!-- Full content for every section, for SEO + the no-JS fallback. Hidden
         by CSS once JS is confirmed running (see the head script above); with
         JS this duplicate never renders (display:none), so it's invisible to
         both sighted users and to a screen reader (which can't reach
         display:none content). Without JS, this is what a visitor gets. -->
      <section id="prerendered" aria-label="full site contents">
        {{prerender}}
      </section>

      <!-- ====== bottom: slim navigation hint ====== -->
      <footer id="hintbar" class="frame">
        click a node to explore · <kbd>Esc</kbd> returns home
      </footer>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
